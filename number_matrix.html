<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Matrix</title>
<style>
  :root { --cell-size: clamp(28px, 8.5vw, 68px); --gap: clamp(4px, 1.2vw, 10px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: #f5f5f7;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(ellipse at 12% 8%, rgba(81, 45, 168, .34), transparent 42%),
      radial-gradient(ellipse at 88% 92%, rgba(0, 150, 170, .20), transparent 45%),
      linear-gradient(135deg, #030305 0%, #101016 48%, #050507 100%);
    background-attachment: fixed;
  }
  .topbar { position: sticky; top: 0; z-index: 5; display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:rgba(5,5,9,.72); backdrop-filter:blur(12px); border-bottom:1px solid #ffffff18; }
  .left-controls { display:flex; gap:12px; align-items:center; }
  .circle-control { display:flex; align-items:center; gap:6px; color:#e9e9ef; font-size:12px; cursor:pointer; user-select:none; }
  .circle-control input { appearance:none; width:17px; height:17px; border-radius:50%; border:2px solid #ff4b57; background:transparent; margin:0; cursor:pointer; }
  .circle-control input:checked { background:#ff3548; box-shadow:0 0 0 3px #ff35482b, 0 0 12px #ff354899; }
  .menu-wrap { position:relative; }
  #menuButton { border:1px solid #ffffff2b; color:#fff; background:linear-gradient(135deg,#24242d,#101015); border-radius:12px; padding:9px 13px; font-size:14px; cursor:pointer; box-shadow:0 5px 20px #0006; }
  .menu-panel { display:none; position:absolute; right:0; top:46px; width:min(290px, calc(100vw - 24px)); padding:12px; border:1px solid #ffffff24; border-radius:15px; background:rgba(18,18,25,.97); box-shadow:0 18px 45px #000b; }
  .menu-panel.open { display:block; }
  .menu-title { font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:#a5a5b5; margin:3px 0 9px; }
  .range-box { padding:10px; background:#ffffff08; border:1px solid #ffffff13; border-radius:10px; margin-bottom:12px; }
  .range-fields { display:flex; gap:8px; align-items:center; }
  .range-fields label { flex:1; font-size:11px; color:#c8c8d2; }
  .range-fields input { display:block; width:100%; margin-top:5px; padding:8px; border-radius:8px; color:#fff; background:#09090e; border:1px solid #ffffff2b; outline:none; }
  .apply { width:100%; margin-top:9px; padding:8px; border:0; border-radius:8px; background:#b24cff; color:white; font-weight:700; cursor:pointer; }
  .toggle-row { display:flex; align-items:center; justify-content:space-between; padding:9px 2px; border-bottom:1px solid #ffffff12; font-size:14px; }
  .toggle-row:last-child { border-bottom:0; }
  .toggle-row input { accent-color:#cf69ff; width:17px; height:17px; }
  main { width:min(100%, 920px); margin:0 auto; padding:22px 10px 34px; }
  h1 { text-align:center; font-size:clamp(20px,4vw,30px); letter-spacing:.04em; margin:3px 0 5px; }
  .subtitle { text-align:center; color:#a6a6b5; font-size:12px; margin:0 0 20px; }
  .matrix { display:grid; grid-template-columns:repeat(10, minmax(0, 1fr)); gap:var(--gap); width:100%; }
  .cell { aspect-ratio:1; min-width:0; display:flex; justify-content:center; align-items:center; position:relative; border:1px solid #ffffff18; border-radius:12px; background:linear-gradient(145deg,#202029b8,#0c0c12d9); box-shadow:inset 0 1px #ffffff0c, 0 4px 12px #0004; font-size:clamp(10px,2.7vw,21px); font-weight:500; color:#e8e8f0; transition:transform .16s, background .16s, border-color .16s; }
  .cell.hidden { visibility:hidden; }
  .cell.even::after { content:""; position:absolute; inset:10%; border:2px solid #45d9ff; border-radius:50%; pointer-events:none; }
  .cell.odd::after { content:""; position:absolute; inset:10%; border:2px solid #ffb547; border-radius:5px; pointer-events:none; }
  .cell.prime { color:#ff73c9; font-weight:850; text-shadow:0 0 12px #ff36ae45; }
  .cell.prime .number { position:relative; z-index:1; }
  .cell.prime { border-color:#ff73c96b; background:linear-gradient(145deg,#4517358c,#17101d); }
  .cell.even.odd::after { border-color:#45d9ff; }
  .legend { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:20px; color:#aaaab8; font-size:11px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:11px; height:11px; display:inline-block; border:2px solid; }
  .dot.circle { border-color:#45d9ff; border-radius:50%; }
  .dot.square { border-color:#ffb547; border-radius:2px; }
  .dot.prime { border-color:#ff73c9; background:#ff73c9; }
  .status { text-align:center; margin-top:12px; font-size:11px; color:#777786; }
  @media (max-width:480px) {
    .topbar { padding:10px; }
    .left-controls { gap:9px; }
    .circle-control { gap:4px; font-size:11px; }
    .circle-control input { width:15px; height:15px; }
    .cell { border-radius:7px; }
    .cell.even::after,.cell.odd::after { border-width:1.5px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="left-controls">
    <label class="circle-control"><input id="reverseToggle" type="checkbox"><span>Reverse</span></label>
    <label class="circle-control"><input id="transposeToggle" type="checkbox"><span>Trans</span></label>
  </div>
  <div class="menu-wrap">
    <button id="menuButton" aria-expanded="false">☰ Menu</button>
    <section class="menu-panel" id="menuPanel">
      <div class="menu-title">Range</div>
      <div class="range-box">
        <div class="range-fields">
          <label>From<input id="rangeStart" type="number" min="1" value="1"></label>
          <label>To<input id="rangeEnd" type="number" min="1" value="100"></label>
        </div>
        <button class="apply" id="applyRange">Apply Range</button>
      </div>
      <div class="menu-title">Number Marks</div>
      <label class="toggle-row"><span>Even — Circle</span><input id="evenToggle" type="checkbox"></label>
      <label class="toggle-row"><span>Odd — Rectangle</span><input id="oddToggle" type="checkbox"></label>
      <label class="toggle-row"><span>Prime — Pink + Bold</span><input id="primeToggle" type="checkbox"></label>
    </section>
  </div>
</header>
<main>
  <h1>NUMBER MATRIX</h1>
  <p class="subtitle">Range-based number grid · 10 columns × 10 rows</p>
  <div class="matrix" id="matrix" aria-label="Number matrix"></div>
  <div class="legend">
    <span><i class="dot circle"></i> Even</span>
    <span><i class="dot square"></i> Odd</span>
    <span><i class="dot prime"></i> Prime</span>
  </div>
  <div class="status" id="status">Showing 1–100</div>
</main>
<script>
(() => {
  const matrix = document.getElementById('matrix');
  const menuButton = document.getElementById('menuButton');
  const menuPanel = document.getElementById('menuPanel');
  const startInput = document.getElementById('rangeStart');
  const endInput = document.getElementById('rangeEnd');
  const status = document.getElementById('status');
  const reverseToggle = document.getElementById('reverseToggle');
  const transposeToggle = document.getElementById('transposeToggle');
  const evenToggle = document.getElementById('evenToggle');
  const oddToggle = document.getElementById('oddToggle');
  const primeToggle = document.getElementById('primeToggle');
  let rangeStart = 1, rangeEnd = 100;

  function isPrime(n) {
    if (n < 2) return false;
    if (n === 2) return true;
    if (n % 2 === 0) return false;
    for (let i = 3; i * i <= n; i += 2) if (n % i === 0) return false;
    return true;
  }

  function render() {
    matrix.replaceChildren();
    const low = Math.min(rangeStart, rangeEnd);
    const high = Math.max(rangeStart, rangeEnd);
    const values = Array.from({length: 100}, (_, i) => i + 1);
    if (reverseToggle.checked) values.reverse();

    // The 100 grid positions repeat for each 100-number block:
    // 1–10 in column 1, 11–20 in column 2, ... 91–100 in column 10.
    const cells = Array(100).fill(null);
    values.forEach((value, displayIndex) => {
      const actualNumber = value + (Math.floor((low - 1) / 100) * 100);
      // Range values are assigned to their standard position within each 100-number block.
      const number = actualNumber;
      if (number >= low && number <= high) {
        const slot = ((number - 1) % 100);
        cells[slot] = number;
      }
    });

    // If range spans more than one 100-block, display the first matching value per slot.
    for (let n = low; n <= high; n++) {
      const slot = (n - 1) % 100;
      if (cells[slot] === null) cells[slot] = n;
    }

    // Reverse changes the order of visible numbers while retaining the selected range's slots.
    if (reverseToggle.checked) {
      const visible = cells.map((n, i) => n !== null && n >= low && n <= high ? {n, i} : null).filter(Boolean);
      const nums = visible.map(x => x.n).reverse();
      visible.forEach((x, i) => { cells[x.i] = nums[i]; });
    }

    for (let row = 0; row < 10; row++) {
      for (let col = 0; col < 10; col++) {
        const slot = transposeToggle.checked ? (col * 10 + row) : (row + col * 10);
        const number = cells[slot];
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (number === null || number < low || number > high) {
          cell.classList.add('hidden');
          cell.setAttribute('aria-hidden', 'true');
        } else {
          cell.textContent = number;
          cell.setAttribute('aria-label', String(number));
          if (evenToggle.checked && number % 2 === 0) cell.classList.add('even');
          if (oddToggle.checked && number % 2 !== 0) cell.classList.add('odd');
          if (primeToggle.checked && isPrime(number)) cell.classList.add('prime');
        }
        matrix.appendChild(cell);
      }
    }
    status.textContent = `Showing ${low}–${high}${reverseToggle.checked ? ' · Reverse ON' : ''}${transposeToggle.checked ? ' · Transpose ON' : ''}`;
  }

  menuButton.addEventListener('click', () => {
    const open = menuPanel.classList.toggle('open');
    menuButton.setAttribute('aria-expanded', String(open));
  });
  document.getElementById('applyRange').addEventListener('click', () => {
    const a = Number(startInput.value), b = Number(endInput.value);
    if (!Number.isFinite(a) || !Number.isFinite(b) || a < 1 || b < 1 || !Number.isInteger(a) || !Number.isInteger(b)) {
      alert('Please enter whole numbers greater than or equal to 1.');
      return;
    }
    rangeStart = Math.min(a, b);
    rangeEnd = Math.max(a, b);
    startInput.value = rangeStart;
    endInput.value = rangeEnd;
    render();
  });
  [reverseToggle, transposeToggle, evenToggle, oddToggle, primeToggle].forEach(el => el.addEventListener('change', render));
  render();
})();
</script>
</body>
</html>
