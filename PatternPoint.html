<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pattern Lock</title>
<style>
  :root { --point-color:#fff; --line-color:#fff; }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; }
  body {
    background:linear-gradient(135deg,#000 0%,#000 98%,#fff 100%);
    color:#fff; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .menu-button {
    position:fixed; top:max(14px,env(safe-area-inset-top)); right:14px; z-index:20;
    width:46px; height:46px; border:1px solid #3b3b3b; border-radius:50%;
    background:#111; color:#fff; display:grid; place-items:center; cursor:pointer;
  }
  .menu-button svg { width:23px;height:23px; }
  .backdrop { position:fixed; inset:0; z-index:29; background:rgba(0,0,0,.45); }
  .backdrop[hidden] { display:none; }
  .menu {
    position:fixed; z-index:30; top:max(68px,calc(env(safe-area-inset-top) + 58px)); right:12px;
    width:min(310px,calc(100vw - 24px)); max-height:calc(100dvh - 84px); overflow-y:auto; overscroll-behavior:contain; padding:17px;
    background:#151515; border:1px solid #383838; border-radius:18px;
    box-shadow:0 18px 55px rgba(0,0,0,.65);
    transform:translateY(-8px) scale(.98); opacity:0; visibility:hidden;
    transition:opacity .18s ease,transform .18s ease,visibility .18s;
  }
  .menu.open { opacity:1; visibility:visible; transform:translateY(0) scale(1); }
  .menu-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:17px; }
  .menu-head h2 { font-size:1.05rem; margin:0; font-weight:650; }
  .close-button { width:34px;height:34px;border-radius:50%;border:1px solid #444;background:#222;color:#fff;font-size:22px;line-height:1;cursor:pointer; }
  .setting { padding:12px 0; border-top:1px solid #303030; }
  .setting label { display:block; color:#ddd; font-size:.9rem; margin-bottom:10px; }
  .menu-subtitle { margin:-9px 0 12px; color:#858585; font-size:.76rem; letter-spacing:.08em; text-transform:uppercase; }
  .mode-description { margin:8px 0 0; color:#888; font-size:.78rem; line-height:1.45; }
  .setting.mode-setting { padding:13px 0; }
  .setting.mode-setting .switch-row span { color:#eee; font-weight:550; }
  .switch-row input:focus-visible, .menu-button:focus-visible, .close-button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
  .color-row { display:flex; align-items:center; gap:11px; }
  .select-control { width:100%; min-height:42px; padding:0 12px; color:#fff; background:#222; border:1px solid #484848; border-radius:10px; font:inherit; }
  .select-control:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  input[type=color] { width:48px;height:38px;padding:2px;background:#222;border:1px solid #555;border-radius:9px; }
  .hex { color:#aaa;font-size:.83rem;letter-spacing:.03em; }
  .switch-row { display:flex !important; align-items:center; justify-content:space-between; gap:12px; margin:0 !important; color:#aaa !important; font-size:.85rem !important; }
  .switch-row input { appearance:none; width:42px; height:24px; border-radius:20px; background:#444; position:relative; cursor:pointer; transition:background .18s; flex:none; }
  .switch-row input::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .18s; }
  .switch-row input:checked { background:#eee; }
  .switch-row input:checked::after { transform:translateX(18px); background:#111; }
  main { width:100%;height:100%;display:grid;place-items:center;padding:20px; }
  .lock-wrap { width:min(86vw,390px,54vh); width:min(86vw,390px,54dvh); }
  .lock { width:100%;aspect-ratio:1;display:block;touch-action:none;user-select:none;-webkit-user-select:none;overflow:visible; }
  .trace { stroke:var(--line-color);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none; }
  .dot { fill:var(--point-color); }
  .point-number { fill:#111; font-family:system-ui,sans-serif; font-weight:750; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
  .lock.numbers-hidden .point-number { display:none; }
  .hit { fill:transparent; }
  @media (max-height:500px) { .lock-wrap { width:min(56vw,52vh,340px); } }
  @media (prefers-reduced-motion:reduce) { .menu { transition:none; } }
</style>
</head>
<body>
  <button class="menu-button" id="menuButton" aria-label="Open settings menu" aria-expanded="false" aria-controls="settingsMenu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>

  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="menu" id="settingsMenu" aria-label="Settings menu" aria-hidden="true">
    <div class="menu-head">
      <h2>Settings</h2>
      <button class="close-button" id="closeMenu" aria-label="Close menu">×</button>
    </div>
    <p class="menu-subtitle">Grid</p>
    <div class="setting">
      <label for="gridSize">Grid Size</label>
      <select id="gridSize" class="select-control" aria-label="Choose grid size"></select>
      <p class="mode-description">Choose from 1×1 to 18×18. Changing the grid clears the current pattern.</p>
    </div>
    <div class="setting mode-setting">
      <label class="switch-row" for="nring">
        <span>Nring</span>
        <input id="nring" type="checkbox" role="switch" aria-label="Show point numbers" checked>
      </label>
      <p class="mode-description">Show or hide the numbers on the points.</p>
    </div>
    <p class="menu-subtitle" style="margin-top:14px">Appearance</p>
    <div class="setting">
      <label for="pointColor">Point Color</label>
      <div class="color-row">
        <input id="pointColor" type="color" value="#ffffff">
        <span class="hex" id="pointHex">#FFFFFF</span>
      </div>
    </div>
    <div class="setting">
      <label for="lineColor">Line Color</label>
      <div class="color-row">
        <input id="lineColor" type="color" value="#ffffff">
        <span class="hex" id="lineHex">#FFFFFF</span>
      </div>
    </div>
    <p class="menu-subtitle" style="margin-top:14px">Drawing Modes</p>
    <div class="setting mode-setting pose-setting">
      <label class="switch-row" for="poseM">
        <span>PoseM</span>
        <input id="poseM" type="checkbox" role="switch" aria-label="PoseM">
      </label>
      <p class="mode-description">Keep completed strokes visible separately.</p>
    </div>
    <div class="setting mode-setting">
      <label class="switch-row" for="mpoint">
        <span>Mpoint</span>
        <input id="mpoint" type="checkbox" role="switch" aria-label="Mpoint">
      </label>
      <p class="mode-description">Reuse any point unlimited times in one continuous pattern.</p>
    </div>
  </aside>

  <main>
    <div class="lock-wrap">
      <svg id="lock" class="lock" viewBox="0 0 300 300" role="img" aria-label="Pattern lock grid. Touch and drag across numbered points.">
        <polyline id="trace" class="trace" points=""></polyline>
        <g id="dots"></g>
      </svg>
    </div>
  </main>

<script>
(() => {
  const svg = document.getElementById('lock');
  const dotsGroup = document.getElementById('dots');
  const trace = document.getElementById('trace');
  const menuButton = document.getElementById('menuButton');
  const menu = document.getElementById('settingsMenu');
  const closeMenuButton = document.getElementById('closeMenu');
  const backdrop = document.getElementById('backdrop');
  const pointColor = document.getElementById('pointColor');
  const lineColor = document.getElementById('lineColor');
  const poseM = document.getElementById('poseM');
  const mpoint = document.getElementById('mpoint');
  const gridSize = document.getElementById('gridSize');
  const nring = document.getElementById('nring');
  const coords = [];
  let selected = [];
  let drawing = false;
  let usedPoints = new Set();
  let completedLines = [];
  let gestureStart = null;
  let outsideTapTimer = null;
  let activeGridSize = 3;
  let hitRadius = 28;
  let pointRadius = 6.5;
  let pointNumberFont = 9;

  for (let n=1; n<=18; n++) {
    const option=document.createElement('option');
    option.value=String(n); option.textContent=`${n} × ${n}`;
    if(n===3) option.selected=true;
    gridSize.appendChild(option);
  }

  function buildGrid(size) {
    activeGridSize=size;
    coords.length=0;
    dotsGroup.replaceChildren();
    selected=[]; drawing=false; usedPoints.clear(); completedLines=[];
    const spacing=300/size;
    pointRadius=Math.max(1.8,Math.min(6.5,spacing*0.19));
    hitRadius=Math.max(2.5,spacing*0.47);
    pointNumberFont=Math.max(3.4,Math.min(10,spacing*0.28));
    for(let row=0;row<size;row++) {
      for(let col=0;col<size;col++) {
        const p={x:150+(col-(size-1)/2)*spacing,y:150+(row-(size-1)/2)*spacing,id:row*size+col};
        coords.push(p);
        const g=document.createElementNS('http://www.w3.org/2000/svg','g');
        const hit=document.createElementNS('http://www.w3.org/2000/svg','circle');
        hit.setAttribute('class','hit'); hit.setAttribute('cx',p.x); hit.setAttribute('cy',p.y); hit.setAttribute('r',hitRadius);
        const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
        dot.setAttribute('class','dot'); dot.dataset.dot=String(p.id); dot.setAttribute('cx',p.x); dot.setAttribute('cy',p.y); dot.setAttribute('r',pointRadius);
        const number=document.createElementNS('http://www.w3.org/2000/svg','text');
        number.setAttribute('class','point-number'); number.setAttribute('x',p.x); number.setAttribute('y',p.y); number.setAttribute('font-size',pointNumberFont); number.textContent=String(p.id+1);
        g.append(hit,dot,number); dotsGroup.appendChild(g);
      }
    }
    svg.setAttribute('aria-label',`${size} by ${size} numbered pattern lock grid. Touch and drag across points.`);
    redraw();
  }
  gridSize.addEventListener('change',()=>buildGrid(Number(gridSize.value)));
  nring.addEventListener('change',()=>svg.classList.toggle('numbers-hidden',!nring.checked));
  svg.classList.toggle('numbers-hidden',!nring.checked);
  buildGrid(3);

  function openMenu() {
    menu.classList.add('open');
    menu.setAttribute('aria-hidden','false');
    menuButton.setAttribute('aria-expanded','true');
    menuButton.setAttribute('aria-label','Close settings menu');
    backdrop.hidden=false;
  }
  function closeMenu() {
    menu.classList.remove('open');
    menu.setAttribute('aria-hidden','true');
    menuButton.setAttribute('aria-expanded','false');
    menuButton.setAttribute('aria-label','Open settings menu');
    backdrop.hidden=true;
  }
  menuButton.addEventListener('click', () => menu.classList.contains('open') ? closeMenu() : openMenu());
  closeMenuButton.addEventListener('click', closeMenu);
  backdrop.addEventListener('click', closeMenu);
  document.addEventListener('keydown', e => { if (e.key==='Escape') closeMenu(); });

  function updateColors() {
    document.documentElement.style.setProperty('--point-color',pointColor.value);
    document.documentElement.style.setProperty('--line-color',lineColor.value);
    document.getElementById('pointHex').textContent=pointColor.value.toUpperCase();
    document.getElementById('lineHex').textContent=lineColor.value.toUpperCase();
  }
  pointColor.addEventListener('input',updateColors);
  lineColor.addEventListener('input',updateColors);

  function clearPattern() {
    selected=[];
    drawing=false;
    if (poseM.checked) {
      usedPoints.clear();
      completedLines=[];
    }
    redraw();
  }
  function resetCurrentStroke() {
    selected=[];
    drawing=false;
    redraw();
  }
  function pointFromEvent(e) {
    const r=svg.getBoundingClientRect();
    return {x:(e.clientX-r.left)*300/r.width,y:(e.clientY-r.top)*300/r.height};
  }
  function nearestDot(pt) {
    let best=null,dist=Infinity;
    coords.forEach(p=>{const d=Math.hypot(p.x-pt.x,p.y-pt.y);if(d<hitRadius&&d<dist){best=p;dist=d;}});
    return best;
  }
  function addDot(p) {
    if(!p)return;
    // Normal and PoseM strokes do not repeat a point within one stroke; Mpoint does.
    if(!mpoint.checked && selected.some(q=>q.id===p.id))return;
    // Avoid adding the same point repeatedly from consecutive pointermove events.
    if(selected.length && selected[selected.length-1].id===p.id)return;
    if(poseM.checked && usedPoints.has(p.id))return;
    if(selected.length && !poseM.checked) {
      const prev=selected[selected.length-1],dx=p.x-prev.x,dy=p.y-prev.y;
      const spacing=300/activeGridSize;
      const colSteps=Math.round(dx/spacing),rowSteps=Math.round(dy/spacing);
      const steps=Math.max(Math.abs(colSteps),Math.abs(rowSteps));
      if(steps>1 && (colSteps===0 || rowSteps===0 || Math.abs(colSteps)===Math.abs(rowSteps))) {
        const gcd=(a,b)=>b===0?Math.abs(a):gcd(b,a%b);
        const divisor=gcd(colSteps,rowSteps);
        const stepX=colSteps/divisor,stepY=rowSteps/divisor;
        for(let i=1;i<divisor;i++) {
          const mid=coords.find(q=>Math.abs(q.x-(prev.x+stepX*spacing*i))<0.01 && Math.abs(q.y-(prev.y+stepY*spacing*i))<0.01);
          if(mid&&!selected.some(q=>q.id===mid.id))selected.push(mid);
        }
      }
    }
    selected.push(p); redraw();
  }
  function redraw() {
    // Keep every PoseM stroke in its own polyline so separate strokes never connect.
    let strokes = svg.querySelector('#savedStrokes');
    if (poseM.checked) {
      if (!strokes) {
        strokes = document.createElementNS('http://www.w3.org/2000/svg','g');
        strokes.setAttribute('id','savedStrokes');
        svg.insertBefore(strokes, dotsGroup);
      }
      strokes.replaceChildren();
      [...completedLines, ...(selected.length ? [selected] : [])].forEach(line => {
        const poly = document.createElementNS('http://www.w3.org/2000/svg','polyline');
        poly.setAttribute('class','trace');
        poly.setAttribute('points',line.map(p=>`${p.x},${p.y}`).join(' '));
        strokes.appendChild(poly);
      });
      trace.setAttribute('points','');
      trace.style.display='none';
    } else {
      if (strokes) strokes.remove();
      trace.style.display='';
      trace.setAttribute('points',selected.map(p=>`${p.x},${p.y}`).join(' '));
    }
    dotsGroup.querySelectorAll('.dot').forEach(d => {
      const id=Number(d.dataset.dot);
      d.classList.toggle('selected',selected.some(p=>p.id===id));
      d.style.opacity='1';
    });
  }
  function finishStroke() {
    if(!selected.length)return;
    if(poseM.checked) {
      completedLines.push([...selected]);
      selected.forEach(p=>usedPoints.add(p.id));
      selected=[];
      redraw();
    } else {
      // Normal mode keeps a completed stroke until the next touch begins.
      redraw();
    }
  }
  function clearAllPoseM() {
    usedPoints.clear();
    completedLines=[];
    selected=[];
    drawing=false;
    redraw();
  }
  svg.addEventListener('pointerdown',e=>{
    const p=nearestDot(pointFromEvent(e)); if(!p)return;
    if(poseM.checked && usedPoints.has(p.id))return;
    e.preventDefault();
    if(poseM.checked) {
      selected=[];
      drawing=true;
      redraw();
    } else {
      clearPattern();
      drawing=true;
    }
    try{svg.setPointerCapture(e.pointerId);}catch(_){}
    addDot(p);
  });
  svg.addEventListener('pointermove',e=>{
    if(!drawing)return;
    const p=nearestDot(pointFromEvent(e));
    if(p)addDot(p);
    else if(selected.length) {
      const pt=pointFromEvent(e);
      trace.setAttribute('points',[...selected.map(q=>`${q.x},${q.y}`),`${pt.x},${pt.y}`].join(' '));
    }
  });
  function endDrawing(){if(!drawing)return;drawing=false;if(poseM.checked)finishStroke();else redraw();}
  svg.addEventListener('pointerup',endDrawing);
  svg.addEventListener('pointercancel',endDrawing);

  // In PoseM mode, double-click/tap outside the grid clears all saved strokes.
  let lastOutsideTap=0;
  svg.addEventListener('dblclick',e=>{
    if(!poseM.checked || nearestDot(pointFromEvent(e)))return;
    e.preventDefault();
    clearAllPoseM();
    lastOutsideTap=0;
  });
  // Double-tap support for touch screens where dblclick is inconsistent.
  svg.addEventListener('pointerdown',e=>{
    if(!poseM.checked || e.pointerType!=='touch' || nearestDot(pointFromEvent(e)))return;
    const now=Date.now();
    if(now-lastOutsideTap<380) {
      clearAllPoseM();
      lastOutsideTap=0;
    } else lastOutsideTap=now;
  }, true);
  poseM.addEventListener('change',()=>{
    if(poseM.checked) mpoint.checked=false;
    clearAllPoseM();
    redraw();
  });
  mpoint.addEventListener('change',()=>{
    if(mpoint.checked) poseM.checked=false;
    clearAllPoseM();
    redraw();
  });
  updateColors();
})();
</script>
</body>
</html>
